name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_image:
        description: "Image de l'application (laisser vide pour utiliser la variable APP_IMAGE ou la valeur par défaut)"
        required: false
  # Relance les tests quand l'image de l'application change (dépôt minishop-app).
  repository_dispatch:
    types: [app-image-published]

permissions:
  contents: read

env:
  # Image publiée par le dépôt minishop-app.
  # À adapter : remplacer <utilisateur> ou définir la variable de dépôt APP_IMAGE.
  APP_IMAGE: ${{ inputs.app_image || vars.APP_IMAGE || format('ghcr.io/{0}/minishop-app:latest', github.repository_owner) }}

jobs:
  test:
    name: Tests (BUGS=${{ matrix.bugs }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # un mode qui échoue ne masque pas l'autre
      matrix:
        bugs: ['off', 'on']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Un conteneur lancé à la main plutôt que « services: » : la variable BUGS
      # doit prendre la valeur de la matrice et un service ne peut pas la lire de façon fiable.
      - name: Démarrer l'application (BUGS=${{ matrix.bugs }})
        run: |
          docker run -d --name minishop -p 3000:3000 -e BUGS=${{ matrix.bugs }} "$APP_IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "L'application ne répond pas sur le port 3000" >&2
          docker logs minishop
          exit 1

      - name: Lancer la suite
        run: npx playwright test --project=chromium
        env:
          BUGS: ${{ matrix.bugs }}
          BASE_URL: http://localhost:3000

      - name: Journaux de l'application
        if: failure()
        run: docker logs minishop

      - name: Publier le rapport HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bugs-${{ matrix.bugs }}
          path: playwright-report/
          retention-days: 14

      # Données brutes Allure : le job « report » en tire le rapport publié sur GitHub Pages.
      - name: Publier les résultats Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bugs-${{ matrix.bugs }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

  # Scan de sécurité passif OWASP ZAP (baseline) contre l'application réelle, dans les deux modes.
  # BUGS=off : l'application conforme ne doit déclencher aucune alerte de niveau FAIL.
  # BUGS=on  : informatif, les failles sont voulues ; le rapport montre ce que ZAP détecte.
  zap:
    name: ZAP baseline (BUGS=${{ matrix.bugs }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bugs: ['off', 'on']

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer l'application (BUGS=${{ matrix.bugs }})
        run: |
          docker run -d --name minishop -p 3000:3000 -e BUGS=${{ matrix.bugs }} "$APP_IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "L'application ne répond pas sur le port 3000" >&2
          docker logs minishop
          exit 1

      # zap-baseline.py renvoie 0 (propre), 1 (alerte FAIL), 2 (avertissements) ou 3 (erreur ZAP).
      # Le code est conservé et jugé à l'étape suivante, pour toujours produire le rapport.
      - name: Scan ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          set +e
          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -j -m 2 -T 10 \
              -r zap-report.html -J zap-report.json -w zap-report.md
          echo "ZAP_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Résumé du scan
        if: ${{ !cancelled() }}
        run: node scripts/zap-summary.mjs zap-out/zap-report.json "${{ matrix.bugs }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport ZAP
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-bugs-${{ matrix.bugs }}
          path: zap-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Appliquer le seuil
        run: |
          echo "Code de sortie ZAP : ${ZAP_EXIT} (0 propre, 1 alerte FAIL, 2 avertissements, 3 erreur ZAP)"
          if [ "${ZAP_EXIT}" = "3" ]; then
            echo "ZAP a rencontré une erreur : le scan n'est pas fiable." >&2
            exit 1
          fi
          if [ "${{ matrix.bugs }}" = "off" ] && [ "${ZAP_EXIT}" = "1" ]; then
            echo "L'application conforme (BUGS=off) a déclenché une alerte de niveau FAIL." >&2
            exit 1
          fi

      - name: Journaux de l'application
        if: failure()
        run: docker logs minishop

  # Tests de performance k6 (k6/minishop.js : smoke, catalogue, authentification, panier).
  # BUGS=off : un seuil dépassé (p95 sous 100 à 250 ms selon le scénario, moins de 1 % d'erreurs) fait échouer le job.
  # BUGS=on  : informatif, le rapport est produit mais ne bloque pas la CI.
  k6:
    name: k6 (BUGS=${{ matrix.bugs }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bugs: ['off', 'on']

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer l'application (BUGS=${{ matrix.bugs }})
        run: |
          docker run -d --name minishop -p 3000:3000 -e BUGS=${{ matrix.bugs }} "$APP_IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "L'application ne répond pas sur le port 3000" >&2
          docker logs minishop
          exit 1

      - uses: grafana/setup-k6-action@v1

      # k6 renvoie 0 (seuils respectés), 99 (seuil dépassé) ou un autre code (erreur de script).
      # Le code est conservé et jugé à l'étape suivante, pour toujours produire le rapport.
      - name: Lancer les scénarios k6
        run: |
          mkdir -p k6-out
          set +e
          K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_EXPORT=k6-out/report.html \
            k6 run -e BASE_URL=http://localhost:3000 -e MODE=${{ matrix.bugs }} k6/minishop.js
          echo "K6_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Résumé des mesures
        if: ${{ !cancelled() }}
        run: |
          if [ -f k6-out/summary.md ]; then
            cat k6-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### k6 (BUGS=${{ matrix.bugs }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun résumé produit : le test n'a pas abouti." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier le rapport k6
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-bugs-${{ matrix.bugs }}
          path: k6-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Appliquer le seuil
        run: |
          echo "Code de sortie k6 : ${K6_EXIT} (0 seuils respectés, 99 seuil dépassé, autre : erreur)"
          if [ "${K6_EXIT}" != "0" ] && [ "${K6_EXIT}" != "99" ]; then
            echo "k6 a rencontré une erreur : le test n'est pas fiable." >&2
            exit 1
          fi
          if [ "${{ matrix.bugs }}" = "off" ] && [ "${K6_EXIT}" = "99" ]; then
            echo "Un seuil de performance est dépassé sur l'application conforme (BUGS=off)." >&2
            exit 1
          fi

      - name: Journaux de l'application
        if: failure()
        run: docker logs minishop

  report:
    name: Rapport Allure (GitHub Pages)
    needs: [test, zap, k6]
    # Publie même si des tests ont échoué (le rapport sert justement à les voir),
    # mais jamais depuis une pull request : seul le code de main alimente le site.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # allure-commandline (générateur de rapport) a besoin de Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Récupérer les résultats Allure des deux modes
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-bugs-*
          path: allure-inputs

      - name: Récupérer les rapports ZAP des deux modes
        uses: actions/download-artifact@v4
        with:
          pattern: zap-report-bugs-*
          path: zap-inputs

      - name: Récupérer les rapports k6 des deux modes
        uses: actions/download-artifact@v4
        with:
          pattern: k6-report-bugs-*
          path: k6-inputs

      - name: Générer les rapports et la page d'accueil
        run: |
          mkdir -p site
          for mode in off on; do
            k6report="k6-inputs/k6-report-bugs-${mode}/report.html"
            if [ -f "$k6report" ]; then
              mkdir -p "site/k6-bugs-${mode}"
              cp "$k6report" "site/k6-bugs-${mode}/index.html"
            else
              echo "Aucun rapport k6 pour BUGS=${mode} : ignoré." >&2
            fi
          done
          for mode in off on; do
            zap="zap-inputs/zap-report-bugs-${mode}/zap-report.html"
            if [ -f "$zap" ]; then
              mkdir -p "site/zap-bugs-${mode}"
              cp "$zap" "site/zap-bugs-${mode}/index.html"
            else
              echo "Aucun rapport ZAP pour BUGS=${mode} : ignoré." >&2
            fi
          done
          for mode in off on; do
            src="allure-inputs/allure-results-bugs-${mode}"
            if [ -d "$src" ] && [ -n "$(ls -A "$src")" ]; then
              npx allure generate "$src" --clean -o "site/bugs-${mode}"
            else
              echo "Aucun résultat Allure pour BUGS=${mode} : rapport ignoré." >&2
            fi
          done
          sed -e "s/__SHA__/${GITHUB_SHA::7}/g" \
              -e "s/__DATE__/$(date -u +'%d\/%m\/%Y %H:%M UTC')/g" \
              scripts/pages-index.html > site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
